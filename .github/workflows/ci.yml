name: Verify and deploy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-verification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ENABLE_LIVE: 'false'
      REQUIRE_PLATFORM_AUTH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Compile Bicep without deploying
        shell: pwsh
        run: |
          az bicep build --file infra/main.bicep --stdout | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse PowerShell deployment scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem scripts -Filter '*.ps1') {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Upload offline evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: |
            artifacts/*.xml
            playwright-report/
            test-results/
          retention-days: 7
  package:
    needs: offline-verification
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package only allowlisted application files
        shell: pwsh
        run: |
          $archive = .\scripts\package.ps1
          .\scripts\test-package.ps1 -ArchivePath $archive
          Move-Item -LiteralPath $archive -Destination (Join-Path $env:RUNNER_TEMP 'app.zip')
      - uses: actions/upload-artifact@v4
        with:
          name: application-${{ github.run_id }}
          path: ${{ runner.temp }}\app.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  deploy:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'zava-demo-pr' || 'zava-demo' }}
      url: https://app-maps-pilot-d2c4f436.azurewebsites.net
    concurrency:
      group: zava-shared-demo-deployment
      cancel-in-progress: false
    env:
      AZURE_CORE_OUTPUT: none
      APP_NAME: app-maps-pilot-d2c4f436
      RESOURCE_GROUP: rg-maps-maps-pilot
      SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: application-${{ github.run_id }}
          path: deployment
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy verified ZIP without provisioning or changing app settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          az webapp deploy --resource-group $env:RESOURCE_GROUP --name $env:APP_NAME --src-path (Join-Path 'deployment' 'app.zip') --type zip --track-status true
          if ($LASTEXITCODE -ne 0) { throw 'Application deployment failed.' }
      - name: Enable public demo without resetting the shared allowance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $limit = az webapp config appsettings list --resource-group $env:RESOURCE_GROUP --name $env:APP_NAME --query "[?name=='LIVE_HTTP_ATTEMPT_LIMIT'].value | [0]" --output tsv
          if ($LASTEXITCODE -ne 0 -or ([string]$limit).Trim() -ne '30') { throw 'Expected existing 30-attempt cap; refusing public access.' }
          az webapp config appsettings set --resource-group $env:RESOURCE_GROUP --name $env:APP_NAME --settings PUBLIC_DEMO=true REQUIRE_PLATFORM_AUTH=false --output none
          if ($LASTEXITCODE -ne 0) { throw 'Public backend configuration failed.' }
          $authId = "/subscriptions/$($env:SUBSCRIPTION_ID)/resourceGroups/$($env:RESOURCE_GROUP)/providers/Microsoft.Web/sites/$($env:APP_NAME)/config/authsettingsV2"
          az resource update --ids $authId --api-version 2023-12-01 --set properties.platform.enabled=false properties.globalValidation.requireAuthentication=false properties.globalValidation.unauthenticatedClientAction=AllowAnonymous --output none
          if ($LASTEXITCODE -ne 0) { throw 'Public platform access configuration failed.' }
          az webapp restart --resource-group $env:RESOURCE_GROUP --name $env:APP_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Restart after public configuration failed.' }
      - name: Verify anonymous harness, API and fixture submission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $site = "https://$($env:APP_NAME).azurewebsites.net"
          $health = $null
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            $probe = Invoke-WebRequest -Uri "$site/healthz" -TimeoutSec 30 -SkipHttpErrorCheck
            if ($probe.StatusCode -eq 200) { $health = $probe; break }
            Write-Warning "Startup probe $attempt returned HTTP $($probe.StatusCode)."
            Start-Sleep -Seconds 10
          }
          if (-not $health) { throw 'Application did not become healthy after restart.' }
          if (($health.Content | ConvertFrom-Json).status -ne 'ok') { throw 'Unexpected health response.' }
          if ($health.Headers['Referrer-Policy'] -ne 'same-origin') { throw 'Required referrer policy is missing.' }
          $handler = [System.Net.Http.HttpClientHandler]::new()
          $handler.AllowAutoRedirect = $false
          $client = [System.Net.Http.HttpClient]::new($handler)
          $client.Timeout = [TimeSpan]::FromSeconds(30)
          try {
            foreach ($path in @('/', '/api/config', '/api/sample')) {
              $anonymous = $null
              for ($attempt = 1; $attempt -le 12; $attempt++) {
                $response = $client.GetAsync("$site$path").GetAwaiter().GetResult()
                if ([int]$response.StatusCode -eq 200) { $anonymous = $response; break }
                $status = [int]$response.StatusCode
                $response.Dispose()
                if ($status -notin @(302, 401, 403, 500, 502, 503, 504)) { throw "Anonymous $path returned HTTP $status." }
                Write-Warning "Public access propagation probe $attempt for $path returned HTTP $status."
                Start-Sleep -Seconds 10
              }
              if (-not $anonymous) { throw "Anonymous $path was not accessible after the bounded restart/propagation wait." }
              try {
                if ([int]$anonymous.StatusCode -ne 200) { throw "Anonymous $path returned HTTP $([int]$anonymous.StatusCode)." }
                if ($path -eq '/api/config') {
                  $config = $anonymous.Content.ReadAsStringAsync().GetAwaiter().GetResult() | ConvertFrom-Json
                  if ($config.attemptBudget.limit -ne 30) { throw 'Shared cap was changed or disabled.' }
                  $usedBefore = $config.attemptBudget.used
                }
                if ($path -eq '/api/sample') { $sample = $anonymous.Content.ReadAsStringAsync().GetAwaiter().GetResult() | ConvertFrom-Json }
              } finally { $anonymous.Dispose() }
            }
            $body = @{mode='fixture';dataset=$sample} | ConvertTo-Json -Depth 30
            $client.DefaultRequestHeaders.Add('Origin', $site)
            $content = [System.Net.Http.StringContent]::new($body, [System.Text.Encoding]::UTF8, 'application/json')
            try {
              $result = $client.PostAsync("$site/api/run", $content).GetAwaiter().GetResult()
              try {
                if ([int]$result.StatusCode -ne 200) { throw "Anonymous fixture POST returned HTTP $([int]$result.StatusCode)." }
                $report = $result.Content.ReadAsStringAsync().GetAwaiter().GetResult() | ConvertFrom-Json
                if ($report.overall.httpAttempts -ne 0 -or $report.results.Count -ne 16) { throw 'Unexpected anonymous fixture report.' }
              } finally { $result.Dispose() }
            } finally { $content.Dispose() }
            "Shared allowance at verification: $usedBefore / 30 used. Probe made no Maps calls." >> $env:GITHUB_STEP_SUMMARY
          } finally { $client.Dispose() }
          "Deployed commit $env:GITHUB_SHA to $site. Anonymous page, API and fixture POST verified; live Maps accuracy is separate." >> $env:GITHUB_STEP_SUMMARY
